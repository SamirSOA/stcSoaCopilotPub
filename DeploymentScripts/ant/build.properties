# Build Properties for Oracle AIA Deployment

# Project Information
project.name=STCSOAAIAWorkspace
project.version=1.0.0

# Environment
target.environment=DEV

# Server Configuration
server.host=localhost
server.port=8001
server.protocol=http
server.user=weblogic
server.password=

# SOA Partition
soa.partition.name=default
soa.composite.revision=1.0

# Build Options
build.verbose=true
build.failonerror=true

# Deployment Options
deploy.overwrite=true
deploy.keepInstances=false
deploy.timeout=300000
