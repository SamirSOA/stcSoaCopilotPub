# AIA Extensions Configuration
# Custom extensions for Oracle AIA framework

# Extension Properties
extension.version=1.0
extension.name=STCCustomExtensions

# Custom Business Services
custom.services.enabled=true
custom.services.namespace=http://xmlns.oracle.com/AIA/STC/Custom

# Custom XREF Configuration
xref.custom.tables=STC_XREF_MAPPING

# Custom DVM Configuration
dvm.custom.location=/AIAMetaData/AIAExtensions/DVM

# Custom Error Handling
custom.error.handler.enabled=true
custom.error.handler.class=com.stc.aia.error.CustomErrorHandler

# Custom Audit Trail
audit.custom.enabled=true
audit.custom.table=STC_AUDIT_TRAIL
