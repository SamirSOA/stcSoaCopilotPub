# Oracle AIA Configuration Properties
# This file contains AIA-specific configuration settings

# AIA Version
aia.version=11.1.1.7.0

# Environment Settings
aia.environment=DEV
aia.instance.name=AIA_INSTANCE_01

# SOA Server Connection
soa.server.host=localhost
soa.server.port=8001
soa.server.protocol=http

# Database Configuration
aia.db.host=localhost
aia.db.port=1521
aia.db.service=AIADB

# JMS Configuration
jms.provider.url=t3://localhost:8001
jms.connection.factory=weblogic.jms.ConnectionFactory

# Error Handling
aia.error.hospital.enabled=true
aia.error.notification.enabled=true
aia.error.email.recipients=admin@example.com

# Logging
aia.logging.level=INFO
aia.logging.path=/var/log/aia

# Cross-Reference
xref.enable=true
xref.default.provider=DB

# Document Validation
aia.validation.enabled=true
aia.validation.mode=STRICT

# Security
aia.security.enabled=true
aia.security.policy=oracle/wss11_saml_token_with_message_protection_service_policy
